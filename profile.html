<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile | TeachWall</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header" data-site-header></header><main><section class="intro"><div class="eyebrow">Account</div><h1>Your learning balance.</h1><p>Keep an eye on the tokens used by your TeachWall activity.</p></section><section id="profile" class="panel">Loading profile...</section><section class="panel" style="margin-top:16px"><div class="actions"><h2 style="margin:0 auto 0 0">Usage history</h2><button id="refresh" class="secondary">Refresh</button></div><div class="table-wrap"><table><thead><tr><th>Action</th><th>Tokens</th><th>Description</th><th>Date</th></tr></thead><tbody id="history"></tbody></table></div></section></main><script src="app.js"></script><script>
renderHeader('profile');if(!requireAuth())throw new Error('Authentication required');const profile=document.getElementById('profile');async function load(){try{const [p,s,h]=await Promise.all([apiFetch('/users/profile'),apiFetch('/users/subscription-status'),apiFetch('/users/token-usage-history?limit=50')]);profile.innerHTML=`<h2>${p.username}</h2><p class="muted">${p.email}</p><div class="stats"><div class="stat"><strong>${p.remainingTokens}</strong><span>Remaining tokens</span></div><div class="stat"><strong>${p.usedTokens}</strong><span>Used tokens</span></div><div class="stat"><strong>${s.usagePercentage}%</strong><span>Usage</span></div><div class="stat"><strong>${s.isSubscriptionActive?'Active':'Inactive'}</strong><span>Subscription</span></div></div>`;document.getElementById('history').innerHTML=(Array.isArray(h)?h:[]).map(x=>`<tr><td>${x.action}</td><td>${x.tokensUsed}</td><td>${x.description}</td><td>${new Date(x.createdAt).toLocaleString()}</td></tr>`).join('')||'<tr><td colspan="4">No usage yet.</td></tr>'}catch(e){showMessage(profile,e.message,'error')}}document.getElementById('refresh').onclick=load;load();
</script></body></html>
