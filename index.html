<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeachWall</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 10px;
        }

        button {
            padding: 10px 18px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .post-btn {
            background: #4f46e5;
            color: white;
        }

        .upvote {
            background: #e5e7eb;
        }

        .result-panel {
            display: none;
            margin-top: 22px;
            padding: 20px;
            border: 1px solid #dbe3f0;
            border-radius: 14px;
            background: linear-gradient(135deg, #f8fbff, #eef4ff);
            box-shadow: 0 8px 24px rgba(30, 64, 175, 0.08);
        }

        .result-panel.visible {
            display: block;
            animation: result-enter 0.3s ease-out;
        }

        .result-label {
            margin: 0 0 8px;
            color: #4f46e5;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .result-panel h3 {
            margin: 0;
            color: #172554;
        }

        .score-summary {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 14px 0 4px;
        }

        .score-value {
            color: #172554;
            font-size: 1.25rem;
            font-weight: 700;
        }

        .star-rating {
            color: #f59e0b;
            font-size: 1.4rem;
            letter-spacing: 0.08em;
        }

        .star-rating .empty-star {
            color: #cbd5e1;
        }

        .result-panel p {
            margin: 12px 0 0;
            color: #334155;
            line-height: 1.7;
            white-space: pre-wrap;
        }

        .result-panel.error {
            border-color: #fecaca;
            background: #fff7f7;
        }

        .result-panel.error .result-label,
        .result-panel.error p {
            color: #b91c1c;
        }

        @keyframes result-enter {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <!-- Header -->
    <header>
        <h1>TeachWall</h1>
        <p>Ask. Explain. Learn Together.</p>
        <p><a href="/answers.html" style="color: white;">Open Answers</a></p>
    </header>


    <!-- Main Container -->
    <div class="container">

        <!-- Post Doubt Card -->
        <div class="card">

            <h2>Post Your Doubt</h2>

            <textarea
                placeholder="Write your doubt here..."
            ></textarea>

            <br>

            <button class="post-btn">
                Post Doubt
            </button>

        </div>


        <!-- Doubt Wall -->
        <div class="card" id="doubtWall">

            <h2>Doubt Wall</h2>
            <div id="postsList" aria-live="polite">Loading posts...</div>

            <hr>
            <h2>Find a Post</h2>
            <input id="postLookupId" type="number" min="0" placeholder="Enter post ID">
            <button id="loadPost" type="button">Load Post</button>
            <div id="singlePost" aria-live="polite"></div>
        </div>
<!-- Teach Me Back -->
        <div class="card">

            <h2>Teach Me Back</h2>

            <p>Explain the concept in your own words:</p>

            <input
                type="text"
                id="topicInput"
                placeholder="Enter topic: pointers or arrays"
                style="width: 100%; padding: 10px; box-sizing: border-box;"
            >

          
    
    <textarea
    id="explanationInput"
    placeholder="Explain the concept in your own words..."
    onpaste="return false"
    oncopy="return false"
    oncut="return false"
    oncontextmenu="return false"
    onkeydown="if ((event.ctrlKey || event.metaKey) && ['v','c','x'].includes(event.key.toLowerCase())) event.preventDefault();">
</textarea>

            <button class="post-btn" id="checkExplanation">
                Check My Explanation
            </button>

            <div id="scoreResult" class="result-panel" aria-live="polite"></div>

        </div>
    </div>


    <!-- JavaScript -->
    <script>
        const API_BASE_URL = "https://thekartik7.runasp.net/api";

        // Get HTML elements
        const textarea = document.querySelector("textarea");
        const postButton = document.querySelector(".post-btn");
        const container = document.querySelector(".container");
        const postsList = document.getElementById("postsList");
        const loadPostButton = document.getElementById("loadPost");
        const singlePost = document.getElementById("singlePost");

        loadPostButton.addEventListener("click", async () => {
            const postId = Number(document.getElementById("postLookupId").value);
            if (!Number.isInteger(postId) || postId < 0) {
                singlePost.textContent = "Enter a valid post ID first.";
                return;
            }

            loadPostButton.disabled = true;
            singlePost.textContent = "Loading post...";

            try {
                const response = await fetch(`${API_BASE_URL}/posts/${postId}`);
                const responseText = await response.text();
                let responseBody;
                try {
                    responseBody = JSON.parse(responseText);
                } catch {
                    responseBody = responseText;
                }

                if (!response.ok) {
                    throw new Error(responseBody.message || `Unable to load the post (HTTP ${response.status}).`);
                }

                const post = responseBody.post || responseBody;
                singlePost.textContent = "";
                const title = document.createElement("h3");
                title.textContent = post.title || "Untitled post";
                const description = document.createElement("p");
                description.textContent = post.description || "";
                const details = document.createElement("p");
                details.textContent = `Post ID: ${post.id ?? postId} | Subject: ${post.subject || "General"} | Author: ${post.author || "Anonymous"}`;
                singlePost.append(title, description, details);
            } catch (error) {
                singlePost.textContent = error.message;
            } finally {
                loadPostButton.disabled = false;
            }
        });

        function renderPosts(data) {
            const posts = Array.isArray(data)
                ? data
                : data.posts || data.items || data.data || [];

            postsList.textContent = "";
            if (!Array.isArray(posts) || posts.length === 0) {
                postsList.textContent = "No posts found.";
                return;
            }

            posts.forEach(post => {
                const postItem = document.createElement("article");
                postItem.className = "post-item";

                const title = document.createElement("h3");
                title.textContent = post.title || "Untitled post";

                const description = document.createElement("p");
                description.textContent = post.description || "";

                const details = document.createElement("p");
                details.textContent = `Post ID: ${post.id ?? "-"} | Subject: ${post.subject || "General"} | Author: ${post.author || "Anonymous"}`;

                const answerButton = document.createElement("button");
                answerButton.className = "answer-btn";
                answerButton.textContent = "💬 Answer";
                answerButton.dataset.postId = post.id ?? "";

                const upvoteButton = document.createElement("button");
                upvoteButton.className = "upvote post-action";
                upvoteButton.textContent = `👍 Upvote (${post.upvotes ?? 0})`;
                upvoteButton.dataset.postId = post.id ?? "";

                const deleteButton = document.createElement("button");
                deleteButton.className = "delete-post post-action";
                deleteButton.textContent = "🗑 Delete";
                deleteButton.dataset.postId = post.id ?? "";

                upvoteButton.addEventListener("click", async () => {
                    upvoteButton.disabled = true;
                    try {
                        const response = await fetch(`${API_BASE_URL}/upvotes`, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ postId: Number(post.id) })
                        });

                        if (!response.ok) {
                            const errorBody = await response.json().catch(() => ({}));
                            throw new Error(errorBody.message || `Unable to upvote the post (HTTP ${response.status}).`);
                        }

                        const currentUpvotes = Number(post.upvotes || 0) + 1;
                        post.upvotes = currentUpvotes;
                        upvoteButton.textContent = `👍 Upvote (${currentUpvotes})`;
                    } catch (error) {
                        alert(error.message);
                    } finally {
                        upvoteButton.disabled = false;
                    }
                });

                deleteButton.addEventListener("click", async () => {
                    if (!confirm(`Delete post ${post.id}?`)) {
                        return;
                    }

                    deleteButton.disabled = true;
                    try {
                        const response = await fetch(`${API_BASE_URL}/posts/${Number(post.id)}`, {
                            method: "DELETE"
                        });

                        if (!response.ok) {
                            const errorBody = await response.json().catch(() => ({}));
                            throw new Error(errorBody.message || `Unable to delete the post (HTTP ${response.status}).`);
                        }

                        postItem.remove();
                    } catch (error) {
                        alert(error.message);
                        deleteButton.disabled = false;
                    }
                });

                postItem.append(title, description, details, upvoteButton, answerButton, deleteButton);
                postsList.appendChild(postItem);
            });
        }

        async function loadPosts() {
            try {
                const response = await fetch(`${API_BASE_URL}/posts`);
                const responseText = await response.text();
                let responseBody;
                try {
                    responseBody = JSON.parse(responseText);
                } catch {
                    responseBody = responseText;
                }

                if (!response.ok) {
                    throw new Error(responseBody.message || `Unable to load posts (HTTP ${response.status}).`);
                }

                renderPosts(responseBody);
            } catch (error) {
                postsList.textContent = error.message;
            }
        }

        loadPosts();


        // When Post Doubt button is clicked
        postButton.addEventListener("click", function () {

            // Get doubt text
            const doubt = textarea.value.trim();


            // Check if doubt is empty
            if (doubt === "") {

                alert("Please write your doubt first!");

                return;
            }


            // Send doubt to backend
            fetch(`${API_BASE_URL}/posts`, {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    title: doubt,

                    description: doubt,

                    subject: "General",

                    author: "Student"

                })

            })


            // Read either JSON or plain-text API responses
            .then(async response => {
                const responseText = await response.text();
                let data;
                try {
                    data = JSON.parse(responseText);
                } catch {
                    data = { message: responseText };
                }

                if (!response.ok) {
                    throw new Error(data.message || `Unable to create the post (HTTP ${response.status}).`);
                }

                return data;
            })


            // When backend responds
            .then(data => {

                console.log("Backend response:", data);


                // Create new doubt card
                const newCard = document.createElement("div");

                newCard.className = "card";


                // Put doubt inside card
                newCard.innerHTML = `

                    <h3>${doubt}</h3>

                    <p>
                        Can someone explain this in very simple words?
                    </p>

                    <button class="upvote">
                        👍 Upvote
                    </button>

                    <button class="answer-btn">
                        💬 Answer
                    </button>

                `;


                // Add new card to the Doubt Wall
                if (postsList.textContent === "Loading posts..." || postsList.textContent === "No posts found.") {
                    postsList.textContent = "";
                }
                postsList.prepend(newCard);


                // Clear textarea
                textarea.value = "";


                // Success message
                alert("Doubt posted successfully!");

            })


            // If something goes wrong
            .catch(error => {

                console.error("Error:", error);

                alert("Something went wrong!");

            });

        });

    
    // Teach Me Back scoring

const topicInput = document.getElementById("topicInput");
const explanationInput = document.getElementById("explanationInput");
const checkExplanation = document.getElementById("checkExplanation");
const scoreResult = document.getElementById("scoreResult");

    async function sendMessage(message) {
        const response = await fetch("https://thekartik7.runasp.net/api/Chat", {
            method: "POST",
            headers: {
                "accept": "text/plain",
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: `${message}\nValidate this Answer.`
            })
        });

        if (!response.ok) {
            throw new Error(`HTTP error: ${response.status}`);
        }

        const result = await response.text();

        try {
            const data = JSON.parse(result);
            return data.reply || result;
        } catch {
            return result;
        }
    }

    async function getScore(topic, explanation) {
        const response = await fetch(`${API_BASE_URL}/teachback`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                topic: topic,
                text: explanation
            })
        });

        if (!response.ok) {
            throw new Error(`Score error: ${response.status}`);
        }

        const score = await response.json();

        return typeof score.score === "number" ? score : null;
    }

    function renderTeachBackResult(score, chatText = "") {
        const scoreMarkup = score
            ? (() => {
                const scoreOutOf10 = typeof score.scoreOutOf10 === "number"
                    ? score.scoreOutOf10
                    : score.score / 10;
                const filledStars = typeof score.starRating === "number"
                    ? score.starRating
                    : Math.round(scoreOutOf10 / 2);
                const stars = "★".repeat(filledStars) + "☆".repeat(5 - filledStars);
                return `
                    <div class="score-summary">
                        <span class="score-value">Score: ${scoreOutOf10}/10</span>
                        <span class="star-rating" aria-label="Rating: ${filledStars} out of 5 stars">
                            Rating:
                            ${stars.slice(0, filledStars)}<span class="empty-star">${stars.slice(filledStars)}</span>
                        </span>
                    </div>
                    <p><strong>${score.level}</strong></p>
                    <p>${score.feedback}</p>
                `;
            })()
            : "";

        scoreResult.className = "result-panel visible";
        scoreResult.innerHTML = `
            <p class="result-label">Teach Me Back</p>
            <h3>Your result</h3>
            ${scoreMarkup}
        `;

        if (chatText) {
            const resultText = document.createElement("p");
            resultText.textContent = chatText;
            scoreResult.appendChild(resultText);
        }
    }

    try {
        const savedResult = JSON.parse(localStorage.getItem("teachMeBackResult"));
        if (savedResult?.score) {
            renderTeachBackResult(savedResult.score, savedResult.chatText);
        }
    } catch (error) {
        localStorage.removeItem("teachMeBackResult");
    }

    checkExplanation.addEventListener("click", async function () {

    const topic = topicInput.value.trim();
    const explanation = explanationInput.value.trim();

    if (topic === "" || explanation === "") {
        alert("Please enter topic and explanation!");
        return;
    }

    checkExplanation.disabled = true;
    checkExplanation.textContent = "Checking...";
    scoreResult.className = "result-panel visible";
    scoreResult.innerHTML = `
        <p class="result-label">Reviewing your explanation</p>
        <p>Comparing your answer with the key ideas...</p>
    `;

    try {
        const [chatResponse, scoreResponse] = await Promise.allSettled([
            sendMessage(`Topic: ${topic}\nExplanation: ${explanation}`),
            getScore(topic, explanation)
        ]);

        if (scoreResponse.status === "rejected") {
            console.error("Local scoring error:", scoreResponse.reason);
        }

        const score = scoreResponse.status === "fulfilled" ? scoreResponse.value : null;
        const chatText = chatResponse.status === "fulfilled" ? chatResponse.value : "";
        renderTeachBackResult(score, chatText);
        if (score) {
            localStorage.setItem("teachMeBackResult", JSON.stringify({ score, chatText }));
        }
    } catch (error) {

        console.error("Error:", error);

        scoreResult.className = "result-panel visible error";
        scoreResult.innerHTML = `
            <p class="result-label">Something went wrong</p>
            <p>${error.message}</p>
        `;
    } finally {
        checkExplanation.disabled = false;
        checkExplanation.textContent = "Check My Explanation";
    }


});
container.addEventListener("click", function (event) {
    if (event.target.classList.contains("answer-btn")) {

        const answerBox = document.createElement("textarea");
        answerBox.placeholder = "Write your answer here...";

        const submitAnswer = document.createElement("button");
        submitAnswer.innerText = "Submit Answer";

        event.target.parentElement.appendChild(answerBox);

        submitAnswer.addEventListener("click", function () {
            const answer = answerBox.value.trim();

            if (answer !== "") {
                const answerText = document.createElement("p");
                answerText.innerText = "Answer: " + answer;

                event.target.parentElement.appendChild(answerText);

                answerBox.remove();
                submitAnswer.remove();
            }
        });
    }
});
</script>




</body>

</html>
