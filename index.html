<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TeachWall</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            margin: 0;
            padding: 0;
        }

        header {
            background: #4f46e5;
            color: white;
            text-align: center;
            padding: 25px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 80%;
            max-width: 800px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
        }

        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 10px;
        }

        button {
            padding: 10px 18px;
            margin-top: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .post-btn {
            background: #4f46e5;
            color: white;
        }

        .upvote {
            background: #e5e7eb;
        }
    </style>
</head>

<body>

    <header>
        <h1>TeachWall</h1>
        <p>Ask. Explain. Learn Together.</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Post Your Doubt</h2>

            <textarea placeholder="Write your doubt here..."></textarea>

            <br>

            <button class="post-btn">Post Doubt</button>
        </div>

        <div class="card">
            <h2>Doubt Wall</h2>

            <h3>What is a constructor in Java?</h3>

            <p>
                Can someone explain constructor in very simple words?
            </p>

            <button class="upvote">👍 Upvote</button>
            <button>💬 Answer</button>
        </div>

    </div>
<script>
const textarea = document.querySelector("textarea");
const postButton = document.querySelector(".post-btn");
const container = document.querySelector(".container");

postButton.addEventListener("click", function () {

    const doubt = textarea.value.trim();

    if (doubt === "") {
        alert("Please write your doubt first!");
        return;
    }

    const newCard = document.createElement("div");
    newCard.className = "card";

    newCard.innerHTML = `
        <h3>${doubt}</h3>
        <p>Can someone explain this in very simple words?</p>
        <button class="upvote">👍 Upvote</button>
        <button>💬 Answer</button>
    `;

    container.appendChild(newCard);

    textarea.value = "";

    alert("Doubt posted successfully!");
});
</script>
</body>
</html>
