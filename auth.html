<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in | TeachWall</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header" data-site-header></header><main class="narrow"><section class="panel"><div class="eyebrow">Your access</div><h1 id="authTitle">Log in</h1><form id="authForm"><div id="usernameField" class="hidden"><label for="username">Username</label><input id="username" autocomplete="username"></div><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><label for="password">Password</label><input id="password" type="password" required autocomplete="current-password"><button id="authSubmit">Log in</button></form><div id="authMessage" class="message" role="status"></div><button id="toggleAuth" class="link-button" type="button">Need an account? Register</button></section></main><script src="app.js"></script><script>
renderHeader(); let registerMode=false; const form=document.getElementById('authForm'); const title=document.getElementById('authTitle'); const username=document.getElementById('usernameField'); const submit=document.getElementById('authSubmit'); const toggle=document.getElementById('toggleAuth'); const message=document.getElementById('authMessage');
toggle.addEventListener('click',()=>{registerMode=!registerMode; title.textContent=registerMode?'Register':'Log in'; username.classList.toggle('hidden',!registerMode); document.getElementById('password').autocomplete=registerMode?'new-password':'current-password'; submit.textContent=registerMode?'Create account':'Log in'; toggle.textContent=registerMode?'Already have an account? Log in':'Need an account? Register';});
form.addEventListener('submit',async e=>{e.preventDefault(); submit.disabled=true; showMessage(message,registerMode?'Creating account...':'Signing in...'); try { const path=registerMode?'/auth/register':'/auth/login'; const body=registerMode?{username:document.getElementById('username').value.trim(),email:email.value.trim(),password:password.value}:{email:email.value.trim(),password:password.value}; const data=await apiFetch(path,{method:'POST',body:JSON.stringify(body)}); if(registerMode){showMessage(message,'Registration successful. You can now log in.','success'); toggle.click();} else {setSession(data); window.location.href='index.html';} } catch(error){showMessage(message,error.message,'error');} finally{submit.disabled=false;} });
</script></body></html>
