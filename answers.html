<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Answers | TeachWall</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header" data-site-header></header><main><section class="intro"><div class="eyebrow">Community</div><h1>Answers that move ideas forward.</h1><p>Choose a post, add what you know, and make the next explanation easier to find.</p></section><div class="grid"><section class="panel"><h2>Submit an answer</h2><form id="answerForm"><label for="postId">Post ID</label><input id="postId" type="number" min="0" required><label for="answer">Your answer</label><textarea id="answer" required placeholder="Explain it clearly..."></textarea><label for="author">Author</label><input id="author" required><button>Submit answer</button></form><div id="answerMessage" class="message"></div></section><section class="panel"><h2>Load answers</h2><form id="answersForm"><label for="answersPostId">Post ID</label><input id="answersPostId" type="number" min="0" required><button class="secondary">Load answers</button></form><div id="answersList"></div></section></div><section class="panel" style="margin-top:16px"><h2>Find an answer</h2><form id="singleForm"><label for="answerId">Answer ID</label><input id="answerId" type="number" min="0" required><div class="actions"><button>Load answer</button><button type="button" id="deleteAnswer" class="danger">Delete answer</button></div></form><div id="singleAnswer" class="message"></div></section></main><script src="app.js"></script><script>
renderHeader('answers');if(!requireAuth())throw new Error('Authentication required');const postQuery=new URLSearchParams(location.search).get('postId');if(postQuery){postId.value=postQuery;answersPostId.value=postQuery}author.value=getCurrentUser()?.username||'';function renderAnswers(data){const items=Array.isArray(data)?data:data.answers||data.items||[];answersList.innerHTML=items.length?items.map(a=>`<article class="answer-item"><p>${a.answer||a.text||''}</p><div class="post-meta">By ${a.author||'Anonymous'} · Answer #${a.id}</div></article>`).join(''):'<p class="muted">No answers found.</p>'}async function loadAnswers(id){answersList.textContent='Loading answers...';try{renderAnswers(await apiFetch('/answers/post/'+id))}catch(e){showMessage(answersList,e.message,'error')}}document.getElementById('answerForm').onsubmit=async e=>{e.preventDefault();try{await apiFetch('/answers',{method:'POST',body:JSON.stringify({postId:Number(postId.value),answer:answer.value.trim(),author:author.value.trim()})});showMessage(answerMessage,'Answer submitted.','success');e.target.reset();author.value=getCurrentUser()?.username||'';await loadAnswers(postId.value)}catch(x){showMessage(answerMessage,x.message,'error')}};document.getElementById('answersForm').onsubmit=e=>{e.preventDefault();loadAnswers(answersPostId.value)};document.getElementById('singleForm').onsubmit=async e=>{e.preventDefault();try{const a=await apiFetch('/answers/'+Number(answerId.value));singleAnswer.innerHTML=`<article class="answer-item"><p>${a.answer||a.text||''}</p><div class="post-meta">By ${a.author||'Anonymous'}</div></article>`}catch(x){showMessage(singleAnswer,x.message,'error')}};document.getElementById('deleteAnswer').onclick=async()=>{try{const id=Number(answerId.value);if(!confirm('Delete this answer?'))return;await apiFetch('/answers/'+id,{method:'DELETE'});showMessage(singleAnswer,'Answer deleted.','success')}catch(x){showMessage(singleAnswer,x.message,'error')}};if(postQuery)loadAnswers(postQuery);
</script></body></html>
