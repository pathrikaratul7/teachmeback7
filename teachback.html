<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Teach Me Back | TeachWall</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header" data-site-header></header><main class="narrow"><section class="intro"><div class="eyebrow">Practice</div><h1>Teach me back.</h1><p>Explain the idea as if you were helping a friend. The service will score clarity and give you a useful next step.</p></section><section class="panel"><form id="teachForm"><label for="topic">Topic</label><input id="topic" required placeholder="e.g. object-oriented programming"><label for="explanation">Your explanation</label><textarea id="explanation" required placeholder="Write your explanation in your own words..."></textarea><button id="submitTeach">Check explanation</button></form><div id="result" class="message"></div></section></main><script src="app.js"></script><script>
renderHeader('teachback'); if(!requireAuth()) throw new Error('Authentication required'); const form=document.getElementById('teachForm');const result=document.getElementById('result');const user=getCurrentUser();form.onsubmit=async e=>{e.preventDefault();const button=document.getElementById('submitTeach');button.disabled=true;showMessage(result,'Scoring your explanation...');try{const data=await apiFetch('/teachback',{method:'POST',body:JSON.stringify({userId:Number(user?.userId),topic:topic.value.trim(),text:explanation.value.trim()})});result.className='panel';result.innerHTML=`<div class="eyebrow">Result</div><h2>${data.level||'Feedback'}</h2><div class="stats"><div class="stat"><strong>${data.scoreOutOf10??'-'}/10</strong><span>Score</span></div><div class="stat"><strong>${data.starRating??'-'}/5</strong><span>Rating</span></div></div><p>${data.feedback||'No feedback returned.'}</p>`}catch(x){showMessage(result,x.message,'error')}finally{button.disabled=false}};
</script></body></html>
