<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posts | TeachWall</title><link rel="stylesheet" href="styles.css"></head>
<body><header class="site-header" data-site-header></header><main><section class="intro"><div class="eyebrow">Community</div><h1>The doubt wall</h1><p>Ask clearly. Browse generously. Good questions make a better learning space.</p></section><div class="grid"><section class="panel"><h2>Post a doubt</h2><form id="postForm"><label for="title">Question</label><input id="title" required placeholder="What do you want to understand?"><label for="description">More context</label><textarea id="description" required placeholder="Add details that help others answer..."></textarea><label for="subject">Subject</label><input id="subject" value="General" required><label for="author">Author</label><input id="author" required><button>Publish question</button></form><div id="postMessage" class="message"></div></section><section class="panel"><h2>Find a post</h2><form id="lookupForm"><label for="lookupId">Post ID</label><input id="lookupId" type="number" min="0" required><button class="secondary">Load post</button></form><div id="singlePost" class="message"></div></section></div><section class="panel" style="margin-top:16px"><div class="actions"><h2 style="margin:0 auto 0 0">Recent posts</h2><button id="reload" class="secondary">Refresh</button></div><div id="postsList">Loading posts...</div></section></main><script src="app.js"></script><script>
renderHeader('posts'); if(!requireAuth()) throw new Error('Authentication required'); const list=document.getElementById('postsList'); const parsePost=p=>`<article class="post-item"><h3>${p.title||'Untitled post'}</h3><p>${p.description||''}</p><div class="post-meta">Post #${p.id} · ${p.subject||'General'} · ${p.author||'Anonymous'} · ${p.upvotes||0} upvotes</div><div class="actions"><button data-upvote="${p.id}" class="secondary">Upvote</button><a class="button secondary" href="answers.html?postId=${p.id}">View answers</a></div></article>`;
async function load(){try{const data=await apiFetch('/posts');const posts=Array.isArray(data)?data:data.posts||data.items||[];list.innerHTML=posts.length?posts.map(parsePost).join(''):'No posts found.'; list.querySelectorAll('[data-upvote]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await apiFetch('/upvotes',{method:'POST',body:JSON.stringify({postId:Number(b.dataset.upvote)})});await load();}catch(e){alert(e.message)}finally{b.disabled=false}})}catch(e){showMessage(list,e.message,'error')}}
document.getElementById('postForm').onsubmit=async e=>{e.preventDefault();const button=e.target.querySelector('button');button.disabled=true;try{await apiFetch('/posts',{method:'POST',body:JSON.stringify({title:title.value.trim(),description:description.value.trim(),subject:subject.value.trim(),author:author.value.trim()})});showMessage(postMessage,'Question published.','success');e.target.reset();subject.value='General';await load()}catch(x){showMessage(postMessage,x.message,'error')}finally{button.disabled=false}};
document.getElementById('lookupForm').onsubmit=async e=>{e.preventDefault();try{const p=await apiFetch('/posts/'+Number(lookupId.value));singlePost.innerHTML=`<article class="post-item"><h3>${p.title}</h3><p>${p.description}</p><div class="post-meta">Post #${p.id} · ${p.subject} · ${p.author}</div></article>`}catch(x){showMessage(singlePost,x.message,'error')}}; document.getElementById('reload').onclick=load; author.value=getCurrentUser()?.username||''; const queryId=new URLSearchParams(location.search).get('postId'); if(queryId){lookupId.value=queryId;document.getElementById('lookupForm').requestSubmit()} load();
</script></body></html>
